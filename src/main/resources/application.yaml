server:
  port: ${SERVER_PORT:8284}

spring:
  application:
    name: lacaeducation
  config:
    import: optional:file:.env.example[.properties]
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecole_local}
    username: ${DB_USER:blufa}
    password: ${DB_PASSWORD:blufa}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    # Par défaut (dev) : migrations + seeds de test (db/seed). Le profil « prod » exclut db/seed.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:0f3306e70e9cd4}
    password: ${MAIL_PASSWORD:947b5a42e9d920}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    test-connection: false

app:
  jwt:
    secret: ${JWT_SECRET:lacaeducation-dev-secret-key-min-32chars!!}
    expiration: 86400
  webhook:
    secret: ${WEBHOOK_SECRET:dev-webhook-secret}
  # Generated documents (report cards, exam convocations, …) are stored on Cloudinary,
  # never on the local filesystem. Fill these in with your Cloudinary credentials.
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  platform:
    # Base of the email-verification link. Local default points at the clickable GET endpoint so the
    # link works without a front-end (Mailtrap, dev). In prod, override with the SPA page URL.
    verification-url: ${VERIFICATION_URL:http://localhost:8284/api/v1/public/verify-email}

# Resend (resend.com) — envoi d'e-mails RÉELS aux parents/enseignants. Tant que enabled=false (défaut,
# dev) ou que la clé manque, le canal EMAIL reste sur SMTP/Mailtrap (voir SmtpEmailGateway). En prod,
# mettre RESEND_ENABLED=true + RESEND_API_KEY + RESEND_FROM (domaine vérifié sur Resend).
resend:
  enabled: ${RESEND_ENABLED:false}
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:Jeccam Edu <no-reply@ecole.jeccamtech.com>}
  base-url: ${RESEND_BASE_URL:https://api.resend.com}

# SMS Orange (Orange Developer) — identifiants UNIQUEMENT via l'environnement. Tant que enabled=false
# ou que les clés manquent, l'envoi SMS se replie sur la journalisation (aucun échec).
orange:
  sms:
    enabled: ${ORANGE_SMS_ENABLED:false}
    client-id: ${ORANGE_SMS_CLIENT_ID:}
    client-secret: ${ORANGE_SMS_CLIENT_SECRET:}
    base-url: ${ORANGE_SMS_BASE_URL:https://api.orange.com}
    sender-address: ${ORANGE_SMS_SENDER_ADDRESS:}
    sender-name: ${ORANGE_SMS_SENDER_NAME:}
    default-country-code: ${ORANGE_SMS_DEFAULT_DIALING:224}

# NimbaSMS (fournisseur SMS actif par défaut) — identifiants UNIQUEMENT via l'environnement.
nimba:
  sms:
    enabled: ${NIMBA_SMS_ENABLED:true}
    service-id: ${NIMBA_SMS_SERVICE_ID:}
    secret-token: ${NIMBA_SMS_SECRET_TOKEN:}
    base-url: ${NIMBA_SMS_BASE_URL:https://api.nimbasms.com}
    sender-name: ${NIMBA_SMS_SENDER_NAME:}
    default-country-code: ${NIMBA_SMS_DEFAULT_DIALING:224}

# Djomy (agrégateur de paiement) — identifiants UNIQUEMENT via l'environnement (.env non commité).
djomy:
  client-id: ${DJOMY_CLIENT_ID:}
  client-secret: ${DJOMY_CLIENT_SECRET:}
  # Clé de signature des webhooks (espace développeur Djomy). Si vide, on utilise client-secret.
  webhook-secret: ${DJOMY_WEBHOOK_SECRET:}
  base-url: ${DJOMY_BASE_URL:https://sandbox-api.djomy.africa}
  currency: ${DJOMY_CURRENCY:GNF}
  return-url: ${DJOMY_RETURN_URL:}
  cancel-url: ${DJOMY_CANCEL_URL:}
  default-country: ${DJOMY_DEFAULT_COUNTRY:GN}
  # Méthodes affichées sur le portail Djomy (allowedPaymentMethods). Vide = toutes.
  allowed-methods: ${DJOMY_ALLOWED_METHODS:OM,MOMO,CARD,SOUTRA_MONEY,PAYCARD}

logging:
  level:
    root: INFO
    org.springframework.web.client: DEBUG
    org.springframework.http: DEBUG
    gn.tauxdechange.payment: DEBUG