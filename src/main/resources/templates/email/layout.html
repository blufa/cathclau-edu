<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${subject}">Notification</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',Arial,sans-serif; background:#f4f6f9; color:#333; }
    .wrapper { max-width:600px; margin:32px auto; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    .header { background:#1e4d8c; color:#fff; padding:28px 32px; }
    .header h1 { font-size:20px; font-weight:600; }
    .header p { font-size:13px; opacity:.8; margin-top:4px; }
    .body { padding:32px; }
    .body h2 { font-size:18px; color:#1e4d8c; margin-bottom:16px; }
    .info-box { background:#f0f4fb; border-left:4px solid #1e4d8c; border-radius:4px; padding:16px 20px; margin:20px 0; }
    .info-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #e0e7f0; font-size:14px; }
    .info-row:last-child { border-bottom:none; }
    .info-label { color:#666; }
    .info-value { font-weight:600; color:#1e4d8c; }
    .badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600; }
    .badge-green { background:#d4edda; color:#155724; }
    .badge-blue { background:#d1ecf1; color:#0c5460; }
    .badge-orange { background:#fff3cd; color:#856404; }
    .btn { display:inline-block; background:#1e4d8c; color:#fff!important; padding:12px 28px; border-radius:6px; text-decoration:none; font-size:14px; font-weight:600; margin-top:20px; }
    .footer { background:#f0f4fb; padding:20px 32px; text-align:center; font-size:12px; color:#888; border-top:1px solid #e0e7f0; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1 th:text="${schoolName}">École</h1>
    <p>Système de gestion scolaire</p>
  </div>
  <div class="body" th:fragment="content">
    <!-- Content injected by child templates -->
  </div>
  <div class="footer">
    <p>Ce message a été envoyé automatiquement. Merci de ne pas y répondre.</p>
    <p style="margin-top:6px;" th:text="${schoolName}">École</p>
  </div>
</div>
</body>
</html>
