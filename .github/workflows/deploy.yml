name: Deploy backend

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.e.outputs.env }}
    steps:
      - id: e
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp verify

  build-push:
    needs: [setup, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/lacaeducation-backend:${{ needs.setup.outputs.env }}
            ghcr.io/${{ env.OWNER }}/lacaeducation-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [setup, build-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sans cette étape, deploy/docker-compose.yml du repo n'était JAMAIS copié sur le VPS — le
      # pull/up ci-dessous tournait toujours contre l'ancien fichier posé là manuellement à l'origine,
      # peu importe les changements commités (vécu en vrai : l'ajout des origines CORS Tauri restait
      # sans effet malgré un déploiement "réussi"). Même fichier sert aussi le service frontend (voir
      # deploy.yml du dépôt frontend) — une seule source de vérité, celle du repo backend.
      - name: Synchroniser deploy/docker-compose.yml vers le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.yml"
          target: "/opt/lacaeducation"
          strip_components: 1

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/lacaeducation
            ENV=${{ needs.setup.outputs.env }}
            docker compose --env-file .env.$ENV -p laca-$ENV pull backend
            # --force-recreate : sans ça, `up -d` peut garder l'ancien conteneur même si le tag pointe
            # maintenant vers une image différente (vécu en vrai — pull réussi, mais conteneur jamais
            # recréé, resté sur l'ancienne image jusqu'à intervention manuelle). Touche dev ET prod,
            # à chaque déploiement, silencieusement — jamais juste un problème ponctuel du correctif CORS.
            docker compose --env-file .env.$ENV -p laca-$ENV up -d --force-recreate backend
            docker image prune -f
